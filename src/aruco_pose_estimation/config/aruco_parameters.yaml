/aruco_node:
    ros__parameters:
        # Aruco detection parameters
        marker_size: 0.071 # Size of the markers in meters
        aruco_dictionary_id: DICT_4X4_50 # Aruco dictionary type
        # Input topics
        image_topic: /mcc/camera/image_raw # Input image topic
        use_depth_input: false # Use depth image for 3D pose estimation
        depth_image_topic: /camera/aligned_depth_to_color/image_raw # Input depth image topic
        camera_info_topic: /mcc/camera/camera_info # Input camera info topic with camera intrinsic parameters
        camera_frame: camera_link_optical # Camera link frame of reference
        # Output topics
        detected_markers_topic: /aruco/markers # Output topic with detected markers (aruco poses + ids)
        markers_visualization_topic: /aruco/poses # Output topic with visualization of detected markers as pose array
        output_image_topic: /aruco/image # Output topic with visualization of detected markers drawn on image

        # Camera calibration (map -> camera_link published on /tf, service: /aruco_node/calibrate)
        map_frame: map # Parent frame of the published camera transform
        camera_link_frame: camera_link # Child frame (camera body link, its optical child comes from the URDF)
        tf_publish_rate: 20.0 # Hz
        calibrate_on_start: true # Calibrate at startup, retry until it succeeds
        calibration_frames: 30 # Detections of every reference tag to collect (median is used)
        calibration_timeout: 15.0 # Seconds before an attempt is abandoned
        max_reprojection_error_px: 2.0 # Reject calibrations with a larger RMS reprojection error
        # Play-area frame published as map -> table after a successful calibration.
        # Origin = top-right corner of the play area, x towards the left, y towards the bottom.
        # x_table = table_width - x_map, y_table = table_height - y_map
        table_frame: table
        table_width: 3.0 # Size of the play area along the map x axis [m]
        table_height: 2.0 # Size of the play area along the map y axis [m]
        # Reference tags: centres in the map frame [m]. Origin = table corner, x along the 3 m side,
        # y along the 2 m side. Same order in the three lists.
        reference_tag_ids: [20, 21, 22, 23]
        reference_tag_x: [2.4, 0.6, 2.4, 0.6]
        reference_tag_y: [0.6, 0.6, 1.4, 1.4]

        # Boxes: centre and yaw of every box tag, in map_frame, published on boxes_topic
        boxes_topic: /aruco/boxes
        box_marker_ids: [13]
        box_tag_to_center: 0.055 # Tag plane -> box centre, along the tag normal [m]
        box_center_height: 0.055 # Height of the box centre above the table when lying down [m]
        box_tag_long_axis: x # In-plane tag axis (x or y) parallel to the long side of the box

        # Robot: pose of the robot tag converted to a robot pose in map_frame, published on /pose.
        # The tag offset and height come from the fixed TF robot_base_frame -> robot_tag_frame (URDF).
        robot_tag_id: 1 # Id of the tag stuck on the robot
        robot_tag_frame: aruco_link # URDF frame of the robot tag (origin at the tag centre)
        robot_base_frame: base_link # Frame whose pose is published on /pose
        robot_ground_frame: "" # Frame on the table plane (e.g. base_footprint) used for the tag height; "" = robot_base_frame is on the table plane
        robot_tag_yaw_offset: 3.14159265 # Rotation [rad] of aruco_link about z relative to the detector tag frame (x right, y up in the tag image); 0 if same convention
        robot_pose_xy_variance: 0.01 # x/y variance written in the /pose covariance [m^2]
        robot_pose_yaw_variance: 0.05 # yaw variance written in the /pose covariance [rad^2]
        set_ekf_pose_on_first: false # Also publish the first robot pose on /set_pose to reset the EKF state