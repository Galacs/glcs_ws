/box_obstacles:
    ros__parameters:
        boxes_topic: /aruco/boxes     # box centres + yaw in the map frame, from aruco_node
        base_map_topic: /map          # only used to copy size/resolution/origin
        grid_topic: /box_map          # consumed by the box_layer in nav2_params.yaml

        # Box (lying on its long side)
        box_length: 0.32
        box_width: 0.11
        footprint_padding: 0.0        # extra margin on top of the Nav2 inflation layer

        # Tracking
        timeout: 0.0                  # s to keep a box after it was last seen (0 = drop at once)
        no_message_timeout: 1.0       # s without any /aruco/boxes message before boxes are dropped
        association_distance: 0.08    # m, same box across frames / seen through two faces
        max_boxes: 15
        publish_rate: 10.0            # Hz, how often the grid is recomputed
        heartbeat_period: 2.0         # s, republish the grid even if unchanged